[project]
name = "evo"
version = "0.1.0"
description = "Self-evolving investment system (phase 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "evo-api",
  "market-data",
  "agent-runner",
]

[tool.uv.workspace]
members = ["apps/api", "apps/agent-runner", "services/market-data"]

[tool.uv.sources]
evo-api = { workspace = true }
market-data = { workspace = true }
agent-runner = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "services/market-data/tests", "apps/agent-runner/tests"]
pythonpath = ["apps/api/src", "apps/agent-runner/src", "services/market-data/src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"