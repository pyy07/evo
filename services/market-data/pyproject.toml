[project]
name = "market-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "pandas>=2.2",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.hatch.build.targets.wheel.force-include]
"src/market_data" = "market_data"