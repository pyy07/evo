# 品种规则 + 选股宇宙。用 stock_type 切换资产类型，而不是绑死单一代码。

default_cash: 1_000_000.0
currency: CNY
paper_trading_only: true

# 可选：stock | etf | convertible_bond（也可被环境变量 STOCK_TYPE 覆盖）
default_stock_type: etf

# 个股宇宙用的指数（仅 stock_type=stock 时生效；也可被 UNIVERSE_INDEX 覆盖）
universe_index: "000300"

kinds:
  stock:
    description: A股个股（沪深北）
    allow_short: false
    lot_size: 100
    commission_rate: 0.00025
    min_commission: 5.0
    code_prefixes:
      - "000"
      - "001"
      - "002"
      - "003"
