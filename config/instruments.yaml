# Investment instrument kind rules (not a symbol whitelist).
# All A-share ETFs are investable; behavior is constrained by kind config.

default_cash: 1_000_000.0
currency: CNY
paper_trading_only: true

kinds:
  etf:
    description: A股 ETF
    allow_short: false
    lot_size: 100
    commission_rate: 0.0001
    min_commission: 0.0
    # Heuristic: common A-share ETF code prefixes (validated softly at order time)
    code_prefixes:
      - "15"
      - "16"
      - "51"
      - "56"
      - "58"
      - "159"
      - "510"
      - "511"
      - "512"
      - "513"
      - "515"
      - "516"
      - "518"
      - "560"
      - "561"
      - "562"
      - "563"
      - "588"